plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

sourceSets {
    regression {
        java.srcDir 'src/regression/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    api 'com.google.code.gson:gson:2.11.0'
    regressionImplementation 'com.google.code.gson:gson:2.8.0'
}

tasks.register('regressionTest', JavaExec) {
    dependsOn tasks.named('regressionClasses')
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.mefrp.mc.ConfigRegressionTest'
}

processResources {
    def versionProperties = [mod_version: project.mod_version]
    inputs.properties versionProperties
    filesMatching('mefrp-version.properties') {
        expand versionProperties
    }
}
