plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.release = 17
}

sourceSets {
    regression {
        java.srcDir 'src/regression/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    api 'com.google.code.gson:gson:2.11.0'
    regressionImplementation 'com.google.code.gson:gson:2.11.0'
}

tasks.register('regressionTest', JavaExec) {
    dependsOn tasks.named('regressionClasses')
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.mefrp.mc.ConfigRegressionTest'
}

processResources {
    def versionProperties = [mod_version: project.mod_version]
    inputs.properties versionProperties
    filesMatching('mefrp-version.properties') {
        expand versionProperties
    }
}
